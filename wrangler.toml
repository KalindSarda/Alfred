name = "finance-tracker"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Serve on the workers.dev address only; no extra public preview address for every version.
workers_dev = true
preview_urls = false

# Static PWA is served from the same Worker; API and webhook routes always hit the Worker first.
[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/telegram/*"]

[[d1_databases]]
# The code reads this as env.DB, so the binding name must stay "DB".
binding = "DB"
database_name = "finance-tracker"
database_id = "dc4a17c4-8278-4ead-8d66-409831138889"
migrations_dir = "drizzle"

# Morning work in three runs, minutes apart so each stays under the Free plan's 50 D1 queries (see src/services/cronPlan.ts):
#   04:30 UTC = 10:00 IST data, 04:35 reminders and salary plans, 04:40 prices, review and the briefing; then the 22:45 IST evening check-in.
# Four of the five triggers the Free plan allows; one is kept spare.
[triggers]
crons = ["30 4 * * *", "35 4 * * *", "40 4 * * *", "15 17 * * *"]

[observability]
enabled = true
